<!DOCTYPE html>
<html>
<head>
    <title>EcoSaver - Login</title>
    <style>
        body { font-family: Arial; background-color: #f2f2f2; text-align: center; }
        form { background: white; padding: 30px; border-radius: 10px; display: inline-block; margin-top: 100px; }
        input { display: block; margin: 10px auto; padding: 10px; width: 250px; }
        button { padding: 10px 20px; background-color: green; color: white; border: none; border-radius: 5px; }
        a { display: block; margin-top: 10px; color: blue; text-decoration: none; }
    </style>
</head>
<body>
    <h1>EcoSaver Login</h1>
    <form action="/login" method="POST">
        <input type="email" name="email" placeholder="Enter your email" required>
        <input type="text" name="meter" placeholder="Enter your meter number" required>
        <button type="submit">Login</button>
    </form>
    <a href="/register">New user? Register here</a>
</body>
</html>
